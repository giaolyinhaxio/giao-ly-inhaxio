<section id="election-public" hidden>
            <h2 id="election-title"></h2>
            <p id="election-status"></p>
            <div id="election-candidates"></div>
            <button id="election-enter-vote" class="primary-button" type="button" hidden>Bầu cử</button>

            <form id="election-ballot" hidden>
              <h3>Chọn ứng cử viên</h3>
              <p id="election-ballot-instruction"></p>
              <div id="election-ballot-candidates"></div>
              <button id="election-cancel-vote" type="button">Quay lại</button>
              <button class="primary-button" type="submit">Gửi phiếu</button>
            </form>

            <p id="election-thanks" role="status" hidden>
              Đã ghi nhận phiếu bầu. Cảm ơn bạn!
            </p>
            <div id="election-result-controls" hidden>
              <button id="election-view-results" class="secondary-button" type="button">Xem kết quả</button>
              <p id="election-wait-message" class="election-result-error" role="alert" hidden></p>
            </div>
          </section>
